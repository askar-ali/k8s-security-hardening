name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck && shellcheck audit/*.sh rbac/*.sh tests/*.sh
      - run: pip install yamllint && yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .
