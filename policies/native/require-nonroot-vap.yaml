# Built-in alternative to Kyverno: ValidatingAdmissionPolicy (GA in Kubernetes 1.30).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-run-as-non-root
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot) ||
        (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) &&
         object.spec.securityContext.runAsNonRoot)
      message: "Pods must run as non-root."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-run-as-non-root
spec:
  policyName: require-run-as-non-root
  validationActions: [Warn, Audit]   # change to [Deny] after review
  matchResources:
    namespaceSelector:
      matchLabels:
        pod-security.kubernetes.io/enforce: restricted
